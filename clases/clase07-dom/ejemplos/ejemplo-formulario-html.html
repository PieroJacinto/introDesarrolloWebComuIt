<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 3: Formularios - Clase 7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        form {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #d4edda;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>📝 Formulario de Contacto</h1>

    <form id="formulario-contacto" novalidate>
        <label>Nombre:</label>
        <input type="text" id="nombre" placeholder="Tu nombre">

        <label>Email:</label>
        <input type="email" id="email" placeholder="tu@email.com">

        <label>Mensaje:</label>
        <textarea id="mensaje" placeholder="Tu mensaje"></textarea>

        <button type="submit">Enviar</button>
        <button type="button" onclick="limpiar()">Limpiar</button>
    </form>

    <div id="resultado"></div>

    <script src="./ejemplo-formulario-js.js"></script>
</body>
</html>
